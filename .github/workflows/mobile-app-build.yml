name: Mobile App - Build

on:
  workflow_dispatch:
  push:
    branches: [feature/mobile-app]
    paths:
      - 'src/Mobile/**'
      - '.github/workflows/mobile-app-build.yml'

permissions:
  contents: read

env:
  CI: '1'

jobs:
  ios:
    name: iPhone IPA for AltStore
    runs-on: macos-26
    timeout-minutes: 40
    concurrency:
      group: mobile-preview-ios-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: src/Mobile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Mobile/package-lock.json

      - run: npm ci
      - run: npm run typecheck && npm test

      - name: Generate the iOS project
        run: npx --no-install expo prebuild --platform ios --clean --no-install

      - name: Cache CocoaPods downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/CocoaPods
          key: >-
            cocoapods-v1-${{ runner.os }}-${{ runner.arch }}-${{
              hashFiles('src/Mobile/package-lock.json', 'src/Mobile/ios/Podfile',
              'src/Mobile/ios/Podfile.properties.json', 'src/Mobile/modules/**/*.podspec') }}

      - name: Install iOS dependencies
        run: pod install --project-directory=ios

      - name: Identify Xcode build version
        id: xcode
        shell: bash
        run: |
          xcode_build="$(xcodebuild -version | awk '/^Build version / { print $3 }')"
          test -n "$xcode_build"
          echo "build=$xcode_build" >> "$GITHUB_OUTPUT"

      # Xcode validates compiler inputs before reusing individual results. Build products stay fresh.
      - name: Cache Xcode compilation results
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/rtxlens-xcode-cache
          key: >-
            xcode-compile-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{
              hashFiles('src/Mobile/package-lock.json', 'src/Mobile/ios/Podfile.lock',
              'src/Mobile/ios/Podfile.properties.json', 'src/Mobile/app.json', 'src/Mobile/app.config.ts',
              'src/Mobile/modules/**/ios/**', 'src/Mobile/modules/**/expo-module.config.json') }}

      - name: Compile and package the unsigned IPA
        shell: bash
        run: |
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(basename "$workspace" .xcworkspace)"
          derived_data="$RUNNER_TEMP/rtxlens-derived-data"
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived_data" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/rtxlens-xcode-cache" build

          app="$(find "$derived_data/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$app"
          bundle="$RUNNER_TEMP/rtxlens-ios"
          mkdir -p "$bundle/Payload"
          ditto "$app" "$bundle/Payload/$(basename "$app")"
          ditto -c -k --keepParent "$bundle/Payload" "$bundle/RTX-Lens-unsigned.ipa"
          unzip -t "$bundle/RTX-Lens-unsigned.ipa" >/dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: RTX-Lens-iOS-AltStore
          path: ${{ runner.temp }}/rtxlens-ios/RTX-Lens-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: mobile-preview-android-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: src/Mobile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci
      - run: npm run typecheck && npm test

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Generate the Android project
        run: npx --no-install expo prebuild --platform android --clean --no-install

      # Cache downloads and dependency metadata. Gradle evaluates and builds the generated project each run.
      - name: Cache Gradle dependencies and wrapper
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
            ~/.gradle/wrapper/dists
          key: >-
            gradle-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{
              hashFiles('src/Mobile/package-lock.json', 'src/Mobile/android/**/*.gradle*',
              'src/Mobile/android/gradle.properties', 'src/Mobile/android/gradle/**',
              'src/Mobile/modules/**/android/**/*.gradle*', 'src/Mobile/modules/**/expo-module.config.json') }}

      - name: Build the Android app
        shell: bash
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon --no-build-cache --no-configuration-cache

      - name: Verify and stage the APK
        shell: bash
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify "$apk"
          mkdir -p "$RUNNER_TEMP/rtxlens-android"
          cp "$apk" "$RUNNER_TEMP/rtxlens-android/RTX-Lens-preview.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: RTX-Lens-Android-Preview
          path: ${{ runner.temp }}/rtxlens-android/RTX-Lens-preview.apk
          if-no-files-found: error
          retention-days: 7
